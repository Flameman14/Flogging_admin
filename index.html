<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우도 해변 관리자 앱</title>
  <style>
    body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: #f4f7f6; display: flex; justify-content: center; height: 100vh; }
    #app-container { width: 100%; max-width: 400px; background: white; height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .screen { display: none; flex-direction: column; height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; }
    .screen.active { display: flex; }
    h2, h3 { color: #333; margin-top: 0; }
    .primary-btn { background: #007bff; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
    .success-btn { background: #28a745; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 48%; }
    .danger-btn { background: #dc3545; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 48%; }
    .outline-btn { background: white; color: #555; border: 1px solid #ccc; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
    .form-group { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .form-group input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    .form-group p { margin: 0 0 10px 0; font-weight: bold; font-size: 14px; color: #333; }
    .radio-label { display: block; font-size: 13px; margin-bottom: 8px; cursor: pointer; color: #555; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .checkbox-label { font-size: 13px; color: #555; display: flex; align-items: center; width: 45%; }
    select, input[type="file"] { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; }
    #result-badge { display: inline-block; padding: 5px 10px; border-radius: 12px; font-size: 14px; font-weight: bold; margin-top: 10px; color: white; }
    .bg-good { background-color: #28a745; }
    .bg-normal { background-color: #ffc107; color: #333 !important; }
    .bg-danger { background-color: #dc3545; }
    .review-card { background: #e3f2fd; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #90caf9; }
    .review-info { font-size: 13px; color: #444; line-height: 1.5; margin-bottom: 10px; }
    .review-photos { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .photo-wrapper { width: 48%; text-align: center; }
    .photo-wrapper img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; background: #eee; }
    .photo-wrapper span { font-size: 11px; color: #555; font-weight: bold; }
    .review-actions { display: flex; justify-content: space-between; }
    .empty-msg { text-align: center; color: #888; font-size: 14px; margin-top: 50px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div id="app-container">
    <div id="login-screen" class="screen active">
      <h2 style="margin-top: 50px;">관리자 로그인 🔐</h2>
      <div class="form-group">
        <input type="password" id="admin-pw" placeholder="관리자 비밀번호 입력">
      </div>
      <button class="primary-btn" onclick="adminLogin()">로그인</button>
    </div>

    <div id="main-screen" class="screen">
      <h2>우도 지킴이 관리자 🌊</h2>
      <button class="primary-btn" onclick="showScreen('morning-check-screen')">🌅 아침 해변 상태 체크</button>
      <button class="primary-btn" style="background: #17a2b8;" onclick="showScreen('verify-screen')">✅ 서포터즈 활동 공인하기</button>
      <button class="outline-btn" onclick="showScreen('history-screen')">📂 처리 내역 조회</button>
    </div>

    <div id="morning-check-screen" class="screen">
      <h2>아침 해변 상태 체크</h2>
      <select id="location-select">
        <option value="검멀레해변">검멀레해변</option>
        <option value="서빈백사">서빈백사</option>
        <option value="하고수동해수욕장">하고수동해수욕장</option>
        <option value="천진항·톨칸이">천진항·톨칸이</option>
        <option value="우도 비양도">우도 비양도</option>
        <option value="답다니탑망대">답다니탑망대</option>
        <option value="서천진동해변">서천진동해변</option>
        <option value="하우목동항">하우목동항</option>
        <option value="서쪽 해안도로">서쪽 해안도로</option>
        <option value="상고수동해변">상고수동해변</option>
      </select>

      <div class="form-group">
        <p>📸 해변 현장 사진 등록</p>
        <input type="file" id="morning-photo" accept="image/*">
      </div>

      <div class="form-group">
        <p>1. 쓰레기가 보이는 범위</p>
        <label class="radio-label"><input type="radio" name="range" value="0" checked> 보이지 않음 (0점)</label>
        <label class="radio-label"><input type="radio" name="range" value="1"> 일부 구간에서 보임 (1점)</label>
        <label class="radio-label"><input type="radio" name="range" value="2"> 전반에서 보임 (2점)</label>
      </div>

      <div class="form-group">
        <p>2. 쓰레기 밀집 정도</p>
        <label class="radio-label"><input type="radio" name="density" value="0" checked> 거의 없음 (0점)</label>
        <label class="radio-label"><input type="radio" name="density" value="1"> 산발적으로 존재 (1점)</label>
        <label class="radio-label"><input type="radio" name="density" value="2"> 한두 곳에 밀집 (2점)</label>
        <label class="radio-label"><input type="radio" name="density" value="3"> 여러 곳에 밀집 (3점)</label>
      </div>

      <div class="form-group">
        <p>3. 사진 밖 주변 쓰레기 여부</p>
        <label class="radio-label"><input type="radio" name="outside" value="0" checked> 없음 (0점)</label>
        <label class="radio-label"><input type="radio" name="outside" value="1"> 있음 (1점)</label>
      </div>

      <div class="form-group" style="background: #e3f2fd; text-align: center;">
        <p>자동 산출 결과</p>
        <h3 id="total-score" style="margin: 0; color: #1976d2;">0점</h3>
        <span id="result-badge" class="bg-good">양호 지역</span>
      </div>

      <button class="primary-btn" id="submit-check-btn" onclick="submitMorningCheck()">점검 완료 및 앱에 반영</button>
      <button class="outline-btn" onclick="showScreen('main-screen')">뒤로 가기</button>
    </div>

    <div id="verify-screen" class="screen">
      <h2>서포터즈 활동 공인</h2>
      <div id="review-list"></div>
      <p id="empty-msg" class="empty-msg">대기 중인 요청이 없습니다.</p>
      <button class="outline-btn" onclick="showScreen('main-screen')" style="margin-top: auto;">뒤로 가기</button>
    </div>

    <div id="history-screen" class="screen">
      <h2>처리 내역 조회</h2>
      <div id="history-list"></div>
      <p id="history-empty-msg" class="empty-msg">처리 내역이 없습니다.</p>
      <button class="outline-btn" onclick="showScreen('main-screen')" style="margin-top: auto;">뒤로 가기</button>
    </div>
  </div>

  <script>
    /* 본인의 파이어베이스 Config 입력 (이전과 동일하게 유지) */
    const firebaseConfig = {
  apiKey: "AIzaSyBir23HnIvMiP7GYXRAKqk0dWtt0hMSgD4",
  authDomain: "flogging-31ab2.firebaseapp.com",
  databaseURL: "https://flogging-31ab2-default-rtdb.firebaseio.com",
  projectId: "flogging-31ab2",
  storageBucket: "flogging-31ab2.firebasestorage.app",
  messagingSenderId: "359921142868",
  appId: "1:359921142868:web:f4f96470b5c2e87ddbb1c1",
  measurementId: "G-XS7T52VWJ4"
};

    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const noPhoto = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='150' height='150'%3E%3Crect width='150' height='150' fill='%23eee'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='14' fill='%23555'%3E대기중%3C/text%3E%3C/svg%3E";
    let currentPhotoBase64 = null;

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function adminLogin() {
      // 데모용 단순 비밀번호 확인
      if(document.getElementById('admin-pw').value === '1234') { 
        showScreen('main-screen');
      } else {
        alert('비밀번호가 일치하지 않습니다.');
      }
    }

    function calculateScore() {
      const r = parseInt(document.querySelector('input[name="range"]:checked').value);
      const d = parseInt(document.querySelector('input[name="density"]:checked').value);
      const o = parseInt(document.querySelector('input[name="outside"]:checked').value);
      const total = r + d + o;
      
      document.getElementById('total-score').innerText = total + '점';
      const badge = document.getElementById('result-badge');
      if (total <= 1) { badge.innerText = '양호'; badge.className = 'bg-good'; }
      else if (total <= 3) { badge.innerText = '수거 권장'; badge.className = 'bg-normal'; }
      else { badge.innerText = '집중수거'; badge.className = 'bg-danger'; }
      return total;
    }

    document.querySelectorAll('#morning-check-screen input[type="radio"]').forEach(r => r.addEventListener('change', calculateScore));

    document.getElementById('morning-photo').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width || 400; let height = img.height || 300;
          if (width > 400) { height = Math.round(height * 400 / width); width = 400; }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
          alert("✅ 사진 첨부 완료! 하단의 '점검 완료' 버튼을 눌러주세요.");
        }
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    async function submitMorningCheck() {
      if (!currentPhotoBase64) { alert('사진을 먼저 등록해주세요.'); return; }
      
      const btn = document.getElementById('submit-check-btn');
      btn.innerText = "업로드 중..."; btn.disabled = true;

      try {
        const loc = document.getElementById('location-select').value;
        const score = calculateScore();
        
        await db.ref('locations/' + loc).update({ score: score, adminPhoto: currentPhotoBase64 });
        alert("✅ 즉시 사용자 앱에 반영되었습니다.");
        currentPhotoBase64 = null;
        btn.innerText = "점검 완료 및 앱에 반영"; btn.disabled = false;
        showScreen('main-screen');
      } catch(e) {
        alert("업로드 실패: " + e.message);
        btn.innerText = "점검 완료 및 앱에 반영"; btn.disabled = false;
      }
    }

    db.ref('pending_approvals').on('value', (snapshot) => {
      const listContainer = document.getElementById('review-list');
      const historyContainer = document.getElementById('history-list');
      
      listContainer.innerHTML = ''; historyContainer.innerHTML = '';
      let pendingCount = 0; let historyCount = 0;

      if(snapshot.val()) {
        for (const [id, info] of Object.entries(snapshot.val())) {
          const photos = info.photos || {};
          const p1 = photos.startSelfie || noPhoto;
          const p2 = photos.startLocation || noPhoto;
          const p3 = photos.endSelfie || noPhoto;
          const p4 = photos.endLocation || noPhoto;
          const types = info.trashTypes ? info.trashTypes.join(', ') : '선택안함';
          const email = info.userEmail || '알 수 없음';

          const cardHtml = `
            <div class="review-info">
              <strong>요청자:</strong> ${email}<br>
              <strong>장소:</strong> ${info.location} | <strong>마대:</strong> ${info.sackCount}개<br>
              <strong>주요 쓰레기:</strong> ${types}
            </div>
            <div class="review-photos">
              <div class="photo-wrapper"><img src="${p1}"><span>시작(본인)</span></div>
              <div class="photo-wrapper"><img src="${p2}"><span>시작(해변)</span></div>
              <div class="photo-wrapper"><img src="${p3}"><span>종료(본인)</span></div>
              <div class="photo-wrapper"><img src="${p4}"><span>종료(해변)</span></div>
            </div>
          `;

          const card = document.createElement('div');
          card.className = 'review-card';

          if (info.status === 'pending') {
            pendingCount++;
            card.innerHTML = cardHtml + `
              <div class="review-actions">
                <button class="success-btn" onclick="approveActivity('${id}', '${info.location}', '${p4}')">승인</button>
                <button class="danger-btn" onclick="rejectActivity('${id}')">반려</button>
              </div>
            `;
            listContainer.appendChild(card);
          } else {
            historyCount++;
            const statusText = info.status === 'approved' ? '<span style="color:#28a745;">✅ 승인됨</span>' : '<span style="color:#dc3545;">🚨 반려됨</span>';
            card.innerHTML = cardHtml + `<div style="text-align:center; font-weight:bold; margin-top:10px;">${statusText}</div>`;
            historyContainer.appendChild(card);
          }
        }
      }
      document.getElementById('empty-msg').style.display = pendingCount === 0 ? 'block' : 'none';
      document.getElementById('history-empty-msg').style.display = historyCount === 0 ? 'block' : 'none';
    });

    function approveActivity(id, loc, photoUrl) {
      if(confirm('승인하시겠습니까?')) {
        db.ref('pending_approvals/' + id).update({ status: 'approved' });
        db.ref('locations/' + loc).update({ approvedUserPhoto: photoUrl });
      }
    }
    
    function rejectActivity(id) {
      if(confirm('반려 처리하시겠습니까?')) {
        db.ref('pending_approvals/' + id).update({ status: 'rejected' });
      }
    }
  </script>
</body>
</html>
